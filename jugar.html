<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juego en sala · Jugador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --fondo: #2433A6;
    --fondo-2: #1C2885;
    --boleto: #FFD23F;
    --tinta: #1A1A2E;
    --blanco: #FFFFFF;
    --chip: #FF7A59;
    --op0: #E5484D;
    --op1: #FFB224;
    --op2: #30A46C;
    --op3: #8E4EC6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    background: var(--fondo);
    color: var(--blanco);
    padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px));
    display: flex;
    justify-content: center;
  }
  [hidden] { display: none !important; }
  main { width: 100%; max-width: 440px; }
  .tarjeta {
    background: var(--boleto);
    color: var(--tinta);
    border-radius: 24px;
    padding: 26px 20px;
    box-shadow: 0 10px 0 var(--fondo-2);
    text-align: center;
  }
  h1 { font-size: 32px; font-weight: 800; line-height: 1.1; }
  .ayuda { font-size: 18px; margin-top: 6px; }
  .sala-arriba { font-size: 18px; font-weight: 700; margin-top: 4px; }
  label { display: block; font-size: 18px; font-weight: 700; margin-top: 20px; text-align: left; }
  input {
    width: 100%; font: inherit; font-size: 26px; font-weight: 700;
    padding: 10px 14px; margin-top: 6px;
    border: 3px solid var(--tinta); border-radius: 14px;
    background: var(--blanco); color: var(--tinta);
  }
  input:focus { outline: 4px solid var(--chip); outline-offset: 2px; }
  #campo-pin input { letter-spacing: 6px; text-align: center; }
  .principal {
    width: 100%; font: inherit; font-size: 24px; font-weight: 800;
    margin-top: 22px; padding: 12px;
    border: none; border-radius: 16px;
    background: var(--fondo); color: var(--blanco); cursor: pointer;
  }
  button:focus-visible { outline: 4px solid var(--chip); outline-offset: 3px; }
  button:disabled { opacity: 0.6; cursor: default; }
  #error { color: #B3261E; font-weight: 700; font-size: 17px; margin-top: 12px; min-height: 1em; }
  .nombre {
    display: inline-block; background: var(--chip); color: var(--tinta);
    font-size: 28px; font-weight: 800; padding: 4px 22px; border-radius: 40px; margin: 16px 0 10px;
  }
  .texto { font-size: 20px; }
  .nota { font-size: 15px; color: #4A4A68; margin-top: 12px; }

  /* Pregunta */
  #pregunta .cabeza { font-size: 17px; font-weight: 700; opacity: 0.85; text-align: center; }
  #pregunta h2 { font-size: 22px; font-weight: 800; text-align: center; margin: 6px 0 16px; line-height: 1.2; }
  .botones { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .resp {
    font: inherit; border: none; border-radius: 18px;
    min-height: 130px; padding: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    color: var(--blanco); cursor: pointer;
  }
  .resp .forma { font-size: 40px; line-height: 1; }
  .resp .txt { font-size: 19px; font-weight: 700; line-height: 1.15; }
  .resp[data-i="0"] { background: var(--op0); }
  .resp[data-i="1"] { background: var(--op1); color: var(--tinta); }
  .resp[data-i="2"] { background: var(--op2); }
  .resp[data-i="3"] { background: var(--op3); }
  .resp:active { transform: scale(0.97); }

  .grande { font-size: 64px; line-height: 1; margin: 6px 0; }
  #conexion { font-size: 14px; color: var(--blanco); opacity: 0.7; text-align: center; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <section class="tarjeta" id="entrada">
    <h1>Únete al juego</h1>
    <p class="sala-arriba" id="sala-arriba"></p>
    <div id="campo-pin">
      <label for="pin">PIN de la sala</label>
      <input id="pin" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="000000">
    </div>
    <label for="nombre">Tu apodo</label>
    <input id="nombre" maxlength="16" autocomplete="off" placeholder="Ej.: Tía Rosa">
    <button class="principal" id="entrar">Entrar a la sala</button>
    <p id="error" role="alert"></p>
  </section>

  <section class="tarjeta" id="espera" hidden>
    <h1>¡Ya estás dentro!</h1>
    <div class="nombre" id="mi-nombre"></div>
    <p class="texto">Mira la TV. El juego empieza cuando el anfitrión lo indique.</p>
    <p class="nota" id="mi-sala"></p>
  </section>

  <section id="pregunta" hidden>
    <p class="cabeza" id="num-pregunta"></p>
    <h2 id="texto-pregunta"></h2>
    <div class="botones">
      <button class="resp" data-i="0"><span class="forma">▲</span><span class="txt"></span></button>
      <button class="resp" data-i="1"><span class="forma">◆</span><span class="txt"></span></button>
      <button class="resp" data-i="2"><span class="forma">●</span><span class="txt"></span></button>
      <button class="resp" data-i="3"><span class="forma">■</span><span class="txt"></span></button>
    </div>
  </section>

  <section class="tarjeta" id="enviado" hidden>
    <div class="grande">⏳</div>
    <h1>Respuesta enviada</h1>
    <p class="texto">Mira la TV para ver si acertaste.</p>
  </section>

  <section class="tarjeta" id="resultado" hidden>
    <div class="grande" id="res-icono"></div>
    <h1 id="res-titulo"></h1>
    <p class="texto" id="res-detalle"></p>
    <p class="nota">Espera la siguiente pregunta.</p>
  </section>

  <section class="tarjeta" id="final" hidden>
    <div class="grande" id="fin-icono">🏁</div>
    <h1>¡Fin del juego!</h1>
    <p class="texto" id="fin-detalle"></p>
    <p class="nota">Si el anfitrión elige "Jugar otra vez", vuelves a la sala automáticamente.</p>
  </section>

  <p id="conexion"></p>
</main>

<script>
  // Datos de tu proyecto en Supabase (la clave anon es pública por diseño)
  const SUPABASE_URL = 'https://vxtahijhzlelbrhmhgwg.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4dGFoaWpoemxlbGJyaG1oZ3dnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MzMyMDEsImV4cCI6MjEwNzQwOTIwMX0.se_aYzHILX_ZCiGljbF3quHaByHl8w6Oql4Vxf0YjVA';
  const VERSION = '5';

  const $ = id => document.getElementById(id);
  const cliente = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ---------- 1. PIN desde el QR ----------
  const pinDelEnlace = new URLSearchParams(location.search).get('sala');
  if (pinDelEnlace && /^\d{6}$/.test(pinDelEnlace)) {
    $('pin').value = pinDelEnlace;
    $('campo-pin').hidden = true;
    $('sala-arriba').textContent = 'Sala ' + pinDelEnlace + ' (v' + VERSION + ')';
  } else {
    $('sala-arriba').textContent = 'Escribe el PIN que aparece en la TV. (v' + VERSION + ')';
  }

  const miId = 'j-' + Math.random().toString(36).slice(2, 10);
  let canal = null;
  let miNombre = '';
  let preguntaActual = -1;
  let yaRespondi = false;

  function verPantalla(cual) {
    ['entrada', 'espera', 'pregunta', 'enviado', 'resultado', 'final'].forEach(p => $(p).hidden = p !== cual);
  }

  function avisarALaTV() {
    canal.send({ type: 'broadcast', event: 'hola', payload: { id: miId, nombre: miNombre } });
    $('conexion').textContent = 'Conectado a la sala · v' + VERSION;
  }

  // ---------- 2. Entrar ----------
  $('entrar').addEventListener('click', () => {
    const pin = $('pin').value.trim();
    miNombre = $('nombre').value.trim();
    $('error').textContent = '';
    if (!/^\d{6}$/.test(pin)) { $('error').textContent = 'El PIN debe tener 6 números.'; return; }
    if (!miNombre) { $('error').textContent = 'Escribe un apodo para entrar.'; return; }

    $('entrar').disabled = true;
    $('entrar').textContent = 'Entrando…';

    canal = cliente.channel('sala-' + pin);

    // La TV manda una pregunta
    canal.on('broadcast', { event: 'pregunta' }, ({ payload }) => {
      preguntaActual = payload.indice;
      yaRespondi = false;
      $('num-pregunta').textContent = 'Pregunta ' + (payload.indice + 1) + ' de ' + payload.total;
      $('texto-pregunta').textContent = payload.texto;
      document.querySelectorAll('.resp').forEach((b, i) => {
        b.querySelector('.txt').textContent = payload.opciones[i];
        b.disabled = false;
      });
      verPantalla('pregunta');
    });

    // La TV revela el resultado
    canal.on('broadcast', { event: 'resultado' }, ({ payload }) => {
      const mio = payload.resultado[miId];
      if (!mio || mio.sinRespuesta) {
        $('res-icono').textContent = '⌛';
        $('res-titulo').textContent = 'Se acabó el tiempo';
        $('res-detalle').textContent = mio ? 'Llevas ' + mio.total + ' puntos.' : 'No alcanzaste a responder esta vez.';
      } else if (mio.acerto) {
        $('res-icono').textContent = '✅';
        $('res-titulo').textContent = '¡Correcto! +' + mio.ganados;
        $('res-detalle').textContent = 'Llevas ' + mio.total + ' puntos.';
      } else {
        $('res-icono').textContent = '❌';
        $('res-titulo').textContent = 'Incorrecto';
        $('res-detalle').textContent = 'Llevas ' + mio.total + ' puntos.';
      }
      verPantalla('resultado');
    });

    // Fin del juego
    canal.on('broadcast', { event: 'final' }, ({ payload }) => {
      const mio = payload.ranking.find(r => r.id === miId);
      if (mio) {
        $('fin-icono').textContent = mio.puesto === 1 ? '🏆' : mio.puesto <= 3 ? '🎉' : '🏁';
        $('fin-detalle').textContent = 'Quedaste en el lugar ' + mio.puesto + ' con ' + mio.puntos + ' puntos.';
      } else {
        $('fin-detalle').textContent = 'Gracias por jugar.';
      }
      verPantalla('final');
    });

    // El anfitrión empieza otra partida
    canal.on('broadcast', { event: 'reinicio' }, () => verPantalla('espera'));

    canal.subscribe(situacion => {
      if (situacion === 'SUBSCRIBED') {
        $('mi-nombre').textContent = miNombre;
        $('mi-sala').textContent = 'Sala ' + pin;
        verPantalla('espera');
        avisarALaTV();
        setInterval(avisarALaTV, 4000);
      } else if (situacion === 'CHANNEL_ERROR' || situacion === 'TIMED_OUT') {
        $('entrar').disabled = false;
        $('entrar').textContent = 'Entrar a la sala';
        $('error').textContent = 'Sin conexión con el servidor. Revisa internet e inténtalo de nuevo.';
        $('conexion').textContent = 'Sin conexión';
      }
    });
  });

  // ---------- 3. Responder ----------
  document.querySelectorAll('.resp').forEach(b => {
    b.addEventListener('click', () => {
      if (yaRespondi || !canal) return;
      yaRespondi = true;
      document.querySelectorAll('.resp').forEach(x => x.disabled = true);
      canal.send({ type: 'broadcast', event: 'respuesta', payload: { id: miId, indice: preguntaActual, opcion: Number(b.dataset.i) } });
      verPantalla('enviado');
    });
  });

  window.addEventListener('pagehide', () => {
    if (canal) canal.send({ type: 'broadcast', event: 'adios', payload: { id: miId } });
  });
  $('nombre').addEventListener('keydown', e => { if (e.key === 'Enter') $('entrar').click(); });
</script>
</body>
</html>
