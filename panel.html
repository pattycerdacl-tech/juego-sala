<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juego en sala · Panel de juegos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --fondo: #2433A6;
    --fondo-2: #1C2885;
    --boleto: #FFD23F;
    --tinta: #1A1A2E;
    --blanco: #FFFFFF;
    --papel: #F2F4FF;
    --linea: #C9D0FF;
    --gris: #55597A;
    --chip: #FF7A59;
    --error: #B3261E;
    --ok: #1E7A4C;
    --op0: #E5484D;
    --op1: #FFB224;
    --op2: #30A46C;
    --op3: #8E4EC6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    background: var(--papel);
    color: var(--tinta);
    font-size: 17px;
    line-height: 1.4;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  [hidden] { display: none !important; }

  header {
    background: var(--fondo);
    color: var(--blanco);
    padding: calc(14px + env(safe-area-inset-top, 0px)) 20px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 24px; font-weight: 800; }
  #usuario { font-size: 15px; display: flex; align-items: center; gap: 10px; }

  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }
  h2 { font-size: 26px; font-weight: 800; }

  .tarjeta { background: var(--blanco); border: 2px solid var(--linea); border-radius: 18px; padding: 20px; }
  label { display: block; font-weight: 700; margin: 14px 0 4px; }
  input[type=text], input[type=email], input[type=password], textarea, select {
    width: 100%; font: inherit; padding: 9px 12px;
    border: 2px solid var(--linea); border-radius: 12px; background: var(--blanco); color: var(--tinta);
  }
  textarea { resize: vertical; min-height: 64px; }
  input:focus, textarea:focus, select:focus { outline: 3px solid var(--fondo); outline-offset: 1px; border-color: var(--fondo); }

  button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 12px; padding: 9px 16px; border: 2px solid transparent; }
  button:focus-visible { outline: 3px solid var(--chip); outline-offset: 2px; }
  button:disabled { opacity: 0.55; cursor: default; }
  .primario { background: var(--fondo); color: var(--blanco); }
  .acento { background: var(--boleto); color: var(--tinta); }
  .secundario { background: var(--blanco); color: var(--fondo); border-color: var(--fondo); }
  .peligro { background: var(--blanco); color: var(--error); border-color: var(--error); }
  .claro { background: transparent; color: var(--blanco); border-color: var(--blanco); padding: 4px 12px; }

  .mensaje { margin-top: 12px; font-weight: 700; min-height: 1.2em; }
  .mensaje.error { color: var(--error); }
  .mensaje.ok { color: var(--ok); }

  /* Acceso */
  #acceso { max-width: 440px; margin: 24px auto 0; }
  #acceso p.ayuda { color: var(--gris); margin-top: 4px; }
  .fila-botones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

  /* Lista */
  .encabezado { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  #mis-juegos { display: grid; gap: 12px; }
  .juego { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .juego .info { flex: 1 1 260px; }
  .juego h3 { font-size: 21px; font-weight: 800; }
  .juego .meta { color: var(--gris); font-size: 15px; }
  .codigo {
    font-size: 22px; font-weight: 800; letter-spacing: 3px;
    background: var(--boleto); border-radius: 10px; padding: 2px 12px;
  }
  .vacio { color: var(--gris); text-align: center; padding: 30px 10px; }

  /* Editor */
  .datos { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .datos .ancho { grid-column: 1 / -1; }
  .check { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-weight: 700; }
  .check input { width: 22px; height: 22px; }
  #lista-preguntas { display: grid; gap: 16px; margin-top: 16px; }
  .pregunta-cab { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .pregunta-cab h3 { font-size: 20px; font-weight: 800; }
  .opciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .op { display: flex; align-items: center; gap: 8px; border-radius: 12px; padding: 6px 8px 6px 10px; }
  .op[data-i="0"] { background: var(--op0); }
  .op[data-i="1"] { background: var(--op1); }
  .op[data-i="2"] { background: var(--op2); }
  .op[data-i="3"] { background: var(--op3); }
  .op .forma { color: var(--blanco); font-size: 20px; width: 22px; text-align: center; }
  .op[data-i="1"] .forma { color: var(--tinta); }
  .op input[type=text] { border: none; padding: 7px 10px; }
  .op input[type=radio] { width: 22px; height: 22px; accent-color: var(--tinta); flex: none; }
  .nota-correcta { color: var(--gris); font-size: 14px; margin-top: 6px; }
  .tiempo { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .tiempo label { margin: 0; }
  .tiempo select { width: auto; }
  .fila { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .fila label { margin: 0; }
  .fila select { width: auto; }
  .op .fijo { flex: 1; color: var(--blanco); font-weight: 800; font-size: 19px; padding: 7px 10px; }
  .op[data-i="1"] .fijo { color: var(--tinta); }
  .imagen-zona { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
  .imagen-zona img { max-height: 160px; max-width: 100%; border-radius: 12px; border: 2px solid var(--linea); }
  .imagen-zona .estado { color: var(--gris); font-size: 15px; }
  .seccion-config { margin-top: 16px; }
  .seccion-config h3 { font-size: 22px; font-weight: 800; }
  .seccion-config .ayuda { color: var(--gris); font-size: 15px; }
  .temas { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 4px; }
  .tema {
    display: flex; flex-direction: column; align-items: stretch; gap: 6px;
    background: var(--blanco); color: var(--tinta); border-color: var(--linea); padding: 8px;
  }
  .tema[aria-pressed="true"] { border-color: var(--tinta); box-shadow: 0 0 0 2px var(--tinta); }
  .muestra { display: flex; height: 34px; border-radius: 8px; overflow: hidden; }
  .muestra span { flex: 1; }
  .acciones-editor { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; align-items: center; }
  .barra-guardar {
    position: sticky; bottom: 0; background: var(--papel);
    padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px));
    border-top: 2px solid var(--linea); margin-top: 20px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }

  @media (max-width: 600px) {
    .datos { grid-template-columns: 1fr; }
    .opciones { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>Panel de juegos</h1>
  <div id="usuario" hidden><span id="correo-usuario"></span><button class="claro" id="salir">Cerrar sesión</button></div>
</header>

<main>
  <!-- ---------- Acceso ---------- -->
  <section id="acceso" class="tarjeta" hidden>
    <h2>Entra para crear juegos</h2>
    <p class="ayuda">Usa tu correo y una contraseña de al menos 6 caracteres. Si es tu primera vez, pulsa "Crear cuenta".</p>
    <label for="correo">Correo</label>
    <input type="email" id="correo" autocomplete="email">
    <label for="clave">Contraseña</label>
    <input type="password" id="clave" autocomplete="current-password">
    <div class="fila-botones">
      <button class="primario" id="entrar">Entrar</button>
      <button class="secundario" id="registrar">Crear cuenta</button>
    </div>
    <p class="mensaje" id="msg-acceso" role="alert"></p>
  </section>

  <!-- ---------- Mis juegos ---------- -->
  <section id="lista" hidden>
    <div class="encabezado">
      <h2>Mis juegos</h2>
      <button class="acento" id="nuevo">+ Nuevo juego</button>
    </div>
    <p class="mensaje" id="msg-lista" role="status"></p>
    <div id="mis-juegos"></div>
  </section>

  <!-- ---------- Editor ---------- -->
  <section id="editor" hidden>
    <div class="encabezado">
      <h2 id="titulo-editor">Nuevo juego</h2>
      <button class="secundario" id="volver">Volver a mis juegos</button>
    </div>

    <div class="tarjeta">
      <div class="datos">
        <div class="ancho">
          <label for="j-titulo">Título del juego</label>
          <input type="text" id="j-titulo" maxlength="80" placeholder="Ej.: Animales del mundo">
        </div>
        <div class="ancho">
          <label for="j-descripcion">Descripción (opcional)</label>
          <input type="text" id="j-descripcion" maxlength="160" placeholder="Ej.: Repaso para 4.º básico">
        </div>
        <div>
          <label for="j-categoria">Categoría</label>
          <select id="j-categoria">
            <option>General</option>
            <option>Familia</option>
            <option>Ciencias</option>
            <option>Historia</option>
            <option>Geografía</option>
            <option>Matemáticas</option>
            <option>Lenguaje</option>
            <option>Inglés</option>
            <option>Deportes</option>
            <option>Música y cine</option>
          </select>
        </div>
        <div>
          <label class="check"><input type="checkbox" id="j-publico"> Visible para todos en la biblioteca</label>
        </div>
      </div>
    </div>

    <div class="tarjeta seccion-config" id="apariencia">
      <h3>🎨 Apariencia</h3>
      <p class="ayuda">Se aplica en la TV y en los teléfonos cuando se carga este juego.</p>
      <label id="et-temas">Colores</label>
      <div class="temas" id="temas" role="group" aria-labelledby="et-temas"></div>
      <label for="c-bienvenida">Mensaje de bienvenida (en la sala de espera)</label>
      <input type="text" id="c-bienvenida" maxlength="60" placeholder="¡A jugar!">
      <label for="c-final">Mensaje final (al terminar el juego)</label>
      <input type="text" id="c-final" maxlength="120" placeholder="Ej.: ¡Gracias por jugar! Feliz cumpleaños, Sofi 🎂">
      <label>Logo (opcional)</label>
      <div class="imagen-zona" id="zona-logo"></div>
      <label>Imagen de fondo (opcional)</label>
      <div class="imagen-zona" id="zona-fondo"></div>
    </div>

    <div id="lista-preguntas"></div>

    <div class="acciones-editor">
      <button class="secundario" id="agregar">+ Agregar pregunta</button>
    </div>

    <div class="barra-guardar">
      <button class="primario" id="guardar">Guardar juego</button>
      <span class="mensaje" id="msg-editor" role="status"></span>
    </div>
  </section>
</main>

<script>
  // Datos de tu proyecto en Supabase (la clave anon es pública por diseño)
  const SUPABASE_URL = 'https://vxtahijhzlelbrhmhgwg.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4dGFoaWpoemxlbGJyaG1oZ3dnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MzMyMDEsImV4cCI6MjEwNzQwOTIwMX0.se_aYzHILX_ZCiGljbF3quHaByHl8w6Oql4Vxf0YjVA';
  const VERSION = '13';

  const $ = id => document.getElementById(id);
  const cliente = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const FORMAS = ['▲', '◆', '●', '■'];

  let usuario = null;
  let editandoId = null;    // null = juego nuevo
  let preguntas = [];
  let config = {};
  const TEMAS = {
    azul:      { nombre: 'Azul clásico', fondo: '#2433A6', fondo2: '#1C2885', boleto: '#FFD23F', chip: '#FF7A59', suave: '#C9D0FF' },
    noche:     { nombre: 'Noche',        fondo: '#1B1F3B', fondo2: '#12152B', boleto: '#7CE0D3', chip: '#FF8FB1', suave: '#B9C0E8' },
    selva:     { nombre: 'Selva',        fondo: '#1F6B4A', fondo2: '#164F37', boleto: '#FFD23F', chip: '#FF9F43', suave: '#C8EBD9' },
    atardecer: { nombre: 'Atardecer',    fondo: '#B83B5E', fondo2: '#8E2C48', boleto: '#FFD369', chip: '#FFB4A2', suave: '#FFD9E0' },
    morado:    { nombre: 'Morado',       fondo: '#5B2A86', fondo2: '#43206A', boleto: '#FFC145', chip: '#4ECDC4', suave: '#DCC9F0' },
    oceano:    { nombre: 'Océano',       fondo: '#0B6E99', fondo2: '#08516F', boleto: '#FFE066', chip: '#FF6B6B', suave: '#C5EAF7' }
  };


  function mensaje(id, texto, tipo) {
    const el = $(id);
    el.textContent = texto || '';
    el.className = 'mensaje' + (tipo ? ' ' + tipo : '');
  }

  function verPantalla(cual) {
    ['acceso', 'lista', 'editor'].forEach(p => $(p).hidden = p !== cual);
    window.scrollTo(0, 0);
  }

  // ---------- 1. Sesión ----------
  async function alCambiarSesion(sesion) {
    usuario = sesion ? sesion.user : null;
    $('usuario').hidden = !usuario;
    if (usuario) {
      $('correo-usuario').textContent = usuario.email;
      verPantalla('lista');
      cargarJuegos();
    } else {
      verPantalla('acceso');
    }
  }

  cliente.auth.onAuthStateChange((_evento, sesion) => alCambiarSesion(sesion));
  cliente.auth.getSession().then(({ data }) => alCambiarSesion(data.session));

  $('entrar').addEventListener('click', async () => {
    const email = $('correo').value.trim(), password = $('clave').value;
    if (!email || password.length < 6) return mensaje('msg-acceso', 'Escribe tu correo y una contraseña de al menos 6 caracteres.', 'error');
    $('entrar').disabled = true;
    const { error } = await cliente.auth.signInWithPassword({ email, password });
    $('entrar').disabled = false;
    if (error) {
      const txt = /confirm/i.test(error.message)
        ? 'Tu correo aún no está confirmado. Revisa tu bandeja de entrada (y spam) y pulsa el enlace.'
        : 'No se pudo entrar: revisa el correo y la contraseña.';
      mensaje('msg-acceso', txt, 'error');
    }
  });

  $('registrar').addEventListener('click', async () => {
    const email = $('correo').value.trim(), password = $('clave').value;
    if (!email || password.length < 6) return mensaje('msg-acceso', 'Escribe tu correo y una contraseña de al menos 6 caracteres.', 'error');
    $('registrar').disabled = true;
    const { data, error } = await cliente.auth.signUp({
      email, password,
      options: { emailRedirectTo: location.origin + location.pathname }
    });
    $('registrar').disabled = false;
    if (error) return mensaje('msg-acceso', 'No se pudo crear la cuenta: ' + error.message, 'error');
    if (!data.session) mensaje('msg-acceso', 'Cuenta creada. Te enviamos un correo: pulsa el enlace para confirmarla y luego vuelve a entrar aquí.', 'ok');
  });

  $('salir').addEventListener('click', () => cliente.auth.signOut());
  $('clave').addEventListener('keydown', e => { if (e.key === 'Enter') $('entrar').click(); });

  // ---------- 2. Mis juegos ----------
  async function cargarJuegos() {
    mensaje('msg-lista', 'Cargando…');
    const { data, error } = await cliente
      .from('juegos')
      .select('id, titulo, descripcion, codigo, categoria, publico, preguntas, config, creado_en')
      .eq('autor', usuario.id)
      .order('creado_en', { ascending: false });
    if (error) return mensaje('msg-lista', 'No se pudieron cargar tus juegos: ' + error.message, 'error');
    mensaje('msg-lista', '');

    const cont = $('mis-juegos');
    cont.innerHTML = '';
    if (!data.length) {
      const p = document.createElement('p');
      p.className = 'vacio tarjeta';
      p.textContent = 'Aún no tienes juegos. Pulsa "+ Nuevo juego" para crear el primero.';
      cont.appendChild(p);
      return;
    }

    data.forEach(j => {
      const tarjeta = document.createElement('div');
      tarjeta.className = 'tarjeta juego';

      const info = document.createElement('div');
      info.className = 'info';
      const h3 = document.createElement('h3'); h3.textContent = j.titulo;
      const meta = document.createElement('p'); meta.className = 'meta';
      const n = (j.preguntas || []).length;
      meta.textContent = n + (n === 1 ? ' pregunta' : ' preguntas') + ' · ' + (j.categoria || 'General') + ' · ' + (j.publico ? 'Público' : 'Privado');
      info.append(h3, meta);

      const codigo = document.createElement('span');
      codigo.className = 'codigo';
      codigo.title = 'Código para cargar este juego en la TV';
      codigo.textContent = j.codigo;

      const editar = document.createElement('button');
      editar.className = 'secundario'; editar.textContent = 'Editar';
      editar.addEventListener('click', () => abrirEditor(j));

      const borrar = document.createElement('button');
      borrar.className = 'peligro'; borrar.textContent = 'Borrar';
      borrar.addEventListener('click', async () => {
        if (!confirm('¿Borrar "' + j.titulo + '"? Esto no se puede deshacer.')) return;
        const { error } = await cliente.from('juegos').delete().eq('id', j.id);
        if (error) return mensaje('msg-lista', 'No se pudo borrar: ' + error.message, 'error');
        mensaje('msg-lista', 'Juego borrado.', 'ok');
        cargarJuegos();
      });

      tarjeta.append(info, codigo, editar, borrar);
      cont.appendChild(tarjeta);
    });
  }

  // ---------- 3. Editor ----------
  const preguntaVacia = () => ({ tipo: 'multiple', texto: '', opciones: ['', '', '', ''], correcta: 0, tiempo: 20, imagen: null });

  function abrirEditor(juego) {
    editandoId = juego ? juego.id : null;
    $('titulo-editor').textContent = juego ? 'Editar juego · código ' + juego.codigo : 'Nuevo juego';
    $('j-titulo').value = juego ? juego.titulo : '';
    $('j-descripcion').value = juego ? (juego.descripcion || '') : '';
    $('j-categoria').value = juego ? (juego.categoria || 'General') : 'General';
    $('j-publico').checked = juego ? !!juego.publico : false;
    config = juego && juego.config ? JSON.parse(JSON.stringify(juego.config)) : {};
    $('c-bienvenida').value = config.bienvenida || '';
    $('c-final').value = config.mensajeFinal || '';
    dibujarApariencia();
    preguntas = juego && juego.preguntas && juego.preguntas.length
      ? JSON.parse(JSON.stringify(juego.preguntas))
      : [preguntaVacia()];
    mensaje('msg-editor', '');
    dibujarPreguntas();
    verPantalla('editor');
    $('j-titulo').focus();
  }

  // ---------- Imágenes: achicar en el navegador y subir a Supabase ----------
  let subiendo = 0;

  function achicarImagen(archivo, maximo = 1280, formato = 'image/jpeg') {
    return new Promise((resolver, rechazar) => {
      const url = URL.createObjectURL(archivo);
      const img = new Image();
      img.onload = () => {
        const escala = Math.min(1, maximo / Math.max(img.width, img.height));
        const lienzo = document.createElement('canvas');
        lienzo.width = Math.round(img.width * escala);
        lienzo.height = Math.round(img.height * escala);
        const c = lienzo.getContext('2d');
        if (formato === 'image/jpeg') { c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, lienzo.width, lienzo.height); }
        c.drawImage(img, 0, 0, lienzo.width, lienzo.height);
        URL.revokeObjectURL(url);
        lienzo.toBlob(b => b ? resolver(b) : rechazar(new Error('No se pudo procesar la imagen')), formato, 0.82);
      };
      img.onerror = () => { URL.revokeObjectURL(url); rechazar(new Error('El archivo no es una imagen válida')); };
      img.src = url;
    });
  }

  // Sube una imagen achicada y devuelve su dirección pública (o null si falla)
  async function subirArchivo(archivo, estado, maximo = 1280, formato = 'image/jpeg') {
    subiendo++;
    estado.textContent = 'Subiendo imagen…';
    try {
      const blob = await achicarImagen(archivo, maximo, formato);
      const ext = formato === 'image/png' ? '.png' : '.jpg';
      const ruta = usuario.id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + ext;
      const { error } = await cliente.storage.from('imagenes').upload(ruta, blob, { contentType: formato });
      if (error) throw error;
      estado.textContent = '';
      return cliente.storage.from('imagenes').getPublicUrl(ruta).data.publicUrl;
    } catch (e) {
      estado.textContent = 'No se pudo subir: ' + (e.message || e);
      return null;
    } finally {
      subiendo--;
    }
  }

  function borrarDeStorage(url) {
    const marca = '/object/public/imagenes/';
    if (url && url.includes(marca)) {
      cliente.storage.from('imagenes').remove([decodeURIComponent(url.split(marca)[1])]); // si falla, no importa
    }
  }

  async function subirImagen(archivo, p, estado) {
    const url = await subirArchivo(archivo, estado);
    if (!url) return;
    p.imagen = url;
    dibujarPreguntas();
    mensaje('msg-editor', 'Imagen lista. Recuerda pulsar "Guardar juego".', 'ok');
  }

  function quitarImagen(p) {
    borrarDeStorage(p.imagen);
    p.imagen = null;
    dibujarPreguntas();
  }

  // Zona reutilizable: vista previa + "Quitar", o botón para subir
  function zonaImagen(cont, url, textoBoton, alSubir, alQuitar, maximo, formato) {
    cont.innerHTML = '';
    const estado = document.createElement('span'); estado.className = 'estado';
    if (url) {
      const vista = document.createElement('img'); vista.src = url; vista.alt = 'Vista previa';
      const bQuitar = document.createElement('button');
      bQuitar.className = 'peligro'; bQuitar.textContent = 'Quitar';
      bQuitar.addEventListener('click', alQuitar);
      cont.append(vista, bQuitar);
    } else {
      const archivo = document.createElement('input');
      archivo.type = 'file'; archivo.accept = 'image/*'; archivo.hidden = true;
      archivo.addEventListener('change', async () => {
        if (!archivo.files[0]) return;
        const nueva = await subirArchivo(archivo.files[0], estado, maximo, formato);
        if (nueva) alSubir(nueva);
      });
      const bSubir = document.createElement('button');
      bSubir.className = 'secundario'; bSubir.textContent = textoBoton;
      bSubir.addEventListener('click', () => archivo.click());
      cont.append(bSubir, archivo, estado);
    }
  }

  function dibujarApariencia() {
    // Temas de colores
    const cont = $('temas');
    cont.innerHTML = '';
    const elegido = TEMAS[config.tema] ? config.tema : 'azul';
    Object.entries(TEMAS).forEach(([clave, t]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'tema';
      b.setAttribute('aria-pressed', clave === elegido);
      const muestra = document.createElement('div'); muestra.className = 'muestra';
      [t.fondo, t.boleto, t.chip].forEach(color => {
        const franja = document.createElement('span'); franja.style.background = color; muestra.appendChild(franja);
      });
      const nombre = document.createElement('span'); nombre.textContent = t.nombre;
      b.append(muestra, nombre);
      b.addEventListener('click', () => { config.tema = clave; dibujarApariencia(); });
      cont.appendChild(b);
    });
    // Logo (PNG para conservar transparencia) y fondo
    zonaImagen($('zona-logo'), config.logo, '🖼️ Subir logo',
      url => { config.logo = url; dibujarApariencia(); },
      () => { borrarDeStorage(config.logo); config.logo = null; dibujarApariencia(); },
      512, 'image/png');
    zonaImagen($('zona-fondo'), config.fondo, '🌄 Subir imagen de fondo',
      url => { config.fondo = url; dibujarApariencia(); },
      () => { borrarDeStorage(config.fondo); config.fondo = null; dibujarApariencia(); },
      1920, 'image/jpeg');
  }

  function dibujarPreguntas() {
    const cont = $('lista-preguntas');
    cont.innerHTML = '';
    preguntas.forEach((p, n) => {
      if (!p.tipo) p.tipo = 'multiple';
      const t = document.createElement('div');
      t.className = 'tarjeta';

      // Encabezado
      const cab = document.createElement('div');
      cab.className = 'pregunta-cab';
      const h3 = document.createElement('h3'); h3.textContent = 'Pregunta ' + (n + 1);
      const quitar = document.createElement('button');
      quitar.className = 'peligro'; quitar.textContent = 'Quitar';
      quitar.disabled = preguntas.length === 1;
      quitar.addEventListener('click', () => { preguntas.splice(n, 1); dibujarPreguntas(); });
      cab.append(h3, quitar);

      // Tipo de pregunta
      const filaTipo = document.createElement('div');
      filaTipo.className = 'fila';
      const lTipo = document.createElement('label'); lTipo.textContent = 'Tipo'; lTipo.htmlFor = 'p' + n + '-tipo';
      const sTipo = document.createElement('select'); sTipo.id = 'p' + n + '-tipo';
      [['multiple', 'Opción múltiple (4 opciones)'], ['vf', 'Verdadero o falso']].forEach(([v, txt]) => {
        const o = document.createElement('option'); o.value = v; o.textContent = txt;
        if (p.tipo === v) o.selected = true;
        sTipo.appendChild(o);
      });
      sTipo.addEventListener('change', () => {
        if (sTipo.value === 'vf') {
          p._multi = p.opciones;
          p.opciones = ['Verdadero', 'Falso'];
        } else {
          p.opciones = p._multi && p._multi.length === 4 ? p._multi : ['', '', '', ''];
        }
        p.tipo = sTipo.value;
        p.correcta = 0;
        dibujarPreguntas();
      });
      filaTipo.append(lTipo, sTipo);

      // Texto
      const lab = document.createElement('label');
      lab.textContent = p.tipo === 'vf' ? 'Afirmación (¿es verdadera o falsa?)' : 'Texto de la pregunta';
      lab.htmlFor = 'p' + n + '-texto';
      const area = document.createElement('textarea');
      area.id = 'p' + n + '-texto'; area.maxLength = 160; area.value = p.texto;
      area.placeholder = p.tipo === 'vf' ? 'Ej.: Las ballenas son peces.' : 'Ej.: ¿Cuál es el animal terrestre más rápido?';
      area.addEventListener('input', () => { p.texto = area.value; });

      // Imagen
      const zonaImg = document.createElement('div');
      zonaImg.className = 'imagen-zona';
      const estado = document.createElement('span'); estado.className = 'estado';
      if (p.imagen) {
        const vista = document.createElement('img');
        vista.src = p.imagen; vista.alt = 'Imagen de la pregunta ' + (n + 1);
        const bQuitar = document.createElement('button');
        bQuitar.className = 'peligro'; bQuitar.textContent = 'Quitar imagen';
        bQuitar.addEventListener('click', () => quitarImagen(p));
        zonaImg.append(vista, bQuitar);
      } else {
        const archivo = document.createElement('input');
        archivo.type = 'file'; archivo.accept = 'image/*'; archivo.hidden = true;
        archivo.addEventListener('change', () => { if (archivo.files[0]) subirImagen(archivo.files[0], p, estado); });
        const bSubir = document.createElement('button');
        bSubir.className = 'secundario'; bSubir.textContent = '📷 Agregar imagen (opcional)';
        bSubir.addEventListener('click', () => archivo.click());
        zonaImg.append(bSubir, archivo, estado);
      }

      // Opciones
      const ops = document.createElement('div');
      ops.className = 'opciones';
      p.opciones.forEach((valor, i) => {
        const fila = document.createElement('div');
        fila.className = 'op'; fila.dataset.i = i;
        const forma = document.createElement('span'); forma.className = 'forma'; forma.textContent = FORMAS[i];
        let campo;
        if (p.tipo === 'vf') {
          campo = document.createElement('span'); campo.className = 'fijo'; campo.textContent = valor;
        } else {
          campo = document.createElement('input');
          campo.type = 'text'; campo.maxLength = 60; campo.value = valor;
          campo.placeholder = 'Opción ' + (i + 1);
          campo.setAttribute('aria-label', 'Opción ' + (i + 1) + ' de la pregunta ' + (n + 1));
          campo.addEventListener('input', () => { p.opciones[i] = campo.value; });
        }
        const radio = document.createElement('input');
        radio.type = 'radio'; radio.name = 'correcta-' + n; radio.checked = p.correcta === i;
        radio.title = 'Marcar como respuesta correcta';
        radio.setAttribute('aria-label', valor ? valor + ' es la correcta' : 'Opción ' + (i + 1) + ' es la correcta');
        radio.addEventListener('change', () => { p.correcta = i; });
        fila.append(forma, campo, radio);
        ops.appendChild(fila);
      });
      const nota = document.createElement('p');
      nota.className = 'nota-correcta';
      nota.textContent = 'Marca el círculo de la respuesta correcta.';

      // Tiempo
      const tiempo = document.createElement('div');
      tiempo.className = 'tiempo';
      const lt = document.createElement('label'); lt.textContent = 'Tiempo para responder'; lt.htmlFor = 'p' + n + '-tiempo';
      const sel = document.createElement('select'); sel.id = 'p' + n + '-tiempo';
      [10, 20, 30, 45, 60].forEach(seg => {
        const o = document.createElement('option'); o.value = seg; o.textContent = seg + ' segundos';
        if (seg === Number(p.tiempo || 20)) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', () => { p.tiempo = Number(sel.value); });
      tiempo.append(lt, sel);

      t.append(cab, filaTipo, lab, area, zonaImg, ops, nota, tiempo);
      cont.appendChild(t);
    });
  }

  $('nuevo').addEventListener('click', () => abrirEditor(null));
  $('volver').addEventListener('click', () => { verPantalla('lista'); cargarJuegos(); });
  $('agregar').addEventListener('click', () => {
    preguntas.push(preguntaVacia());
    dibujarPreguntas();
    const ultima = $('p' + (preguntas.length - 1) + '-texto');
    if (ultima) { ultima.scrollIntoView({ behavior: 'smooth', block: 'center' }); ultima.focus(); }
  });

  $('guardar').addEventListener('click', async () => {
    const titulo = $('j-titulo').value.trim();
    if (!titulo) return mensaje('msg-editor', 'Escribe un título para el juego.', 'error');

    if (subiendo) return mensaje('msg-editor', 'Espera a que termine de subir la imagen.', 'error');

    for (let n = 0; n < preguntas.length; n++) {
      const p = preguntas[n];
      p.texto = p.texto.trim();
      if (!p.texto) return mensaje('msg-editor', 'Falta el texto de la pregunta ' + (n + 1) + '.', 'error');
      if (p.tipo === 'vf') {
        p.opciones = ['Verdadero', 'Falso'];
        if (p.correcta > 1) p.correcta = 0;
      } else {
        p.tipo = 'multiple';
        p.opciones = p.opciones.map(o => o.trim());
        if (p.opciones.some(o => !o)) return mensaje('msg-editor', 'Completa las 4 opciones de la pregunta ' + (n + 1) + '.', 'error');
      }
    }

    const datos = {
      titulo,
      descripcion: $('j-descripcion').value.trim() || null,
      categoria: $('j-categoria').value,
      publico: $('j-publico').checked,
      config: {
        ...config,
        tema: TEMAS[config.tema] ? config.tema : 'azul',
        bienvenida: $('c-bienvenida').value.trim(),
        mensajeFinal: $('c-final').value.trim(),
        logo: config.logo || null,
        fondo: config.fondo || null
      },
      preguntas: preguntas.map(({ _multi, ...resto }) => ({ ...resto, imagen: resto.imagen || null }))
    };

    $('guardar').disabled = true;
    mensaje('msg-editor', 'Guardando…');
    const consulta = editandoId
      ? cliente.from('juegos').update(datos).eq('id', editandoId).select('id, codigo').single()
      : cliente.from('juegos').insert(datos).select('id, codigo').single();
    const { data, error } = await consulta;
    $('guardar').disabled = false;

    if (error) return mensaje('msg-editor', 'No se pudo guardar: ' + error.message, 'error');
    editandoId = data.id;
    $('titulo-editor').textContent = 'Editar juego · código ' + data.codigo;
    mensaje('msg-editor', 'Guardado. Código para la TV: ' + data.codigo, 'ok');
  });
</script>
